<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nano Care | Digital Passport</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <img src="logo.png" class="logo">

            <h1>NANO CARE</h1>

            <p>Digital Vehicle Passport</p>

        </div>

        <div class="card">

            <img id="carImage" src="" class="car-image">

            <div class="placeholder" id="imagePlaceholder">

                🚗

            </div>

        </div>

        <div class="card">

            <h2>بيانات السيارة</h2>

            <div class="row">
                <span>الماركة</span>
                <span id="brand">...</span>
            </div>

            <div class="row">
                <span>الموديل</span>
                <span id="model">...</span>
            </div>

            <div class="row">
                <span>السنة</span>
                <span id="year">...</span>
            </div>

            <div class="row">
                <span>اللون</span>
                <span id="color">...</span>
            </div>

            <div class="row">
                <span>رقم اللوحة</span>
                <span id="plate">...</span>
            </div>

            <div class="row">
                <span>رقم الشاسيه</span>
                <span id="chassis">...</span>
            </div>

        </div>

        <div class="card">

            <h2>بيانات العميل</h2>

            <div class="row">
                <span>الاسم</span>
                <span id="customerName">...</span>
            </div>

            <div class="row">
                <span>الهاتف</span>
                <span id="customerPhone">...</span>
            </div>

            <div class="row">
                <span>العنوان</span>
                <span id="customerAddress">...</span>
            </div>

        </div>

        <div class="card">

            <h2>الخدمات</h2>

            <div id="services">

            </div>

        </div>

        <div class="card">

    <h2>المستندات والشهادات</h2>

    <div id="documents"></div>

</div>

<div class="card">

    <h2>جدول الصيانة</h2>

    <div id="maintenance"></div>

</div>

        <div class="footer">

            Powered By Nano Care

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>

</body>

</html>
